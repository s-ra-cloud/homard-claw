          $ref: "#/components/schemas/NotifyPrefs"
    ScheduleUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        objective: { type: string, minLength: 3, maxLength: 5000 }
        priority: { type: string, enum: [low, normal, high] }
        providerOverride: { type: [string, "null"] }
        modelOverride: { type: [string, "null"] }
        budgetCents: { type: [number, "null"] }
        cadence: { type: string, enum: [once, daily, weekly, monthly] }
        timezone: { type: string, minLength: 1, maxLength: 60 }
        runAt: { type: string, format: date-time }
        timeOfDay: { type: string, pattern: "^([01]?\\d|2[0-3]):[0-5]\\d$" }
        daysOfWeek:
          type: array
          items: { type: number, minimum: 0, maximum: 6 }
        dayOfMonth: { type: number, minimum: 1, maximum: 31 }
        notify:
          $ref: "#/components/schemas/NotifyPrefs"
        enabled: { type: boolean }
    Schedule:
      type: object
