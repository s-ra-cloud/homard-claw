      properties:
        id: { type: string }
        name: { type: string }
        agentId: { type: string }
        agentName: { type: string }
        objective: { type: string }
        priority: { type: string }
        providerOverride: { type: [string, "null"] }
        modelOverride: { type: [string, "null"] }
        budgetCents: { type: [number, "null"] }
        cadence: { type: string, enum: [once, daily, weekly, monthly] }
        timezone: { type: string }
        runAt: { type: [string, "null"], format: date-time }
        timeOfDay: { type: [string, "null"] }
        daysOfWeek:
          type: [array, "null"]
          items: { type: number }
        dayOfMonth: { type: [number, "null"] }
        notify:
          $ref: "#/components/schemas/NotifyPrefs"
        enabled: { type: boolean }
        nextRunAt: { type: [string, "null"], format: date-time }
        lastRunAt: { type: [string, "null"], format: date-time }
        lastTaskId: { type: [string, "null"] }
        lastTaskStatus: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, kind, title, body, read, createdAt]
      properties:
        id: { type: string }
        kind: { type: string }
        title: { type: string }
        body: { type: string }
        taskId: { type: [string, "null"] }
        agentId: { type: [string, "null"] }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [unread, notifications]
      properties:
        unread: { type: number }
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
    MarkNotificationsReadInput:
      type: object
      properties:
        ids:
          type: array
          items: { type: string }
          maxItems: 500
    UsageReport:
      type: object
      required: [totals, outcomes, agents, providers, blockers]
      properties:
        totals:
          type: object
          required: [todayCostCents, last7dCostCents, monthCostCents, monthInputTokens, monthOutputTokens]
          properties:
            todayCostCents: { type: number }
            last7dCostCents: { type: number }
            monthCostCents: { type: number }
            monthInputTokens: { type: number }
            monthOutputTokens: { type: number }
        outcomes:
          type: object
          required: [completed, failed, blocked, cancelled, queued, running, waitingApproval]
          properties:
            completed: { type: number }
            failed: { type: number }
            blocked: { type: number }
            cancelled: { type: number }
            queued: { type: number }
            running: { type: number }
            waitingApproval: { type: number }
        agents:
          type: array
          items:
            type: object
            required: [agentId, name, status, tasksCompleted, tasksFailed, inputTokens, outputTokens, costCents]
            properties:
              agentId: { type: string }
              name: { type: string }
              status: { type: string }
              tasksCompleted: { type: number }
              tasksFailed: { type: number }
              inputTokens: { type: number }
              outputTokens: { type: number }
              costCents: { type: number }
        providers:
          type: array
          items:
            type: object
            required: [provider, tasks, inputTokens, outputTokens, costCents]
            properties:
              provider: { type: string }
              tasks: { type: number }
              inputTokens: { type: number }
              outputTokens: { type: number }
              costCents: { type: number }
        blockers:
          type: array
          items:
            type: object
            required: [taskId, agentName, objective, createdAt]
            properties:
              taskId: { type: string }
              agentName: { type: string }
              objective: { type: string }
              errorKind: { type: [string, "null"] }
              errorMessage: { type: [string, "null"] }
              createdAt: { type: string, format: date-time }
