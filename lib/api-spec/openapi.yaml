openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HomardClaw private agent office API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: office
    description: Agent office operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /office/overview:
    get:
      operationId: getOfficeOverview
      tags: [office]
      summary: Get the live office overview
      responses:
        "200":
          description: Office state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeOverview"
  /agents:
    get:
      operationId: listAgents
      tags: [office]
      summary: List agent profiles
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [office]
      summary: Create an agent profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /agents/{agentId}:
    get:
      operationId: getAgent
      tags: [office]
      summary: Get one agent with its task history
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"
        "404":
          description: Agent not found
    patch:
      operationId: updateAgent
      tags: [office]
      summary: Update an agent profile
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Agent not found
        "409":
          description: Name already in use or agent retired
    delete:
      operationId: deleteAgent
      tags: [office]
      summary: Permanently delete an agent and its task history
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "204":
          description: Agent deleted
        "404":
          description: Agent not found
        "409":
          description: Retired agents cannot be deleted
  /agents/{agentId}/duplicate:
    post:
      operationId: duplicateAgent
      tags: [office]
      summary: Duplicate an agent's configuration as a new agent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "201":
          description: Duplicated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Agent not found
        "409":
          description: Agent retired
  /agents/{agentId}/archive:
    post:
      operationId: setAgentArchived
      tags: [office]
      summary: Archive or restore an agent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveInput"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Agent not found
        "409":
          description: Agent retired
  /agents/{agentId}/pause:
    post:
      operationId: pauseAgent
      tags: [office]
      summary: Pause or resume an agent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PauseInput"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /agents/{agentId}/retire:
    post:
      operationId: retireAgent
      tags: [office]
      summary: Permanently retire an agent to the island
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Retired agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetiredAgent"
        "404":
          description: Agent not found
        "409":
          description: Agent already retired
  /island/agents:
    get:
      operationId: listRetiredAgents
      tags: [office]
      summary: List retired agents relaxing on the island
      responses:
        "200":
          description: Retired agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RetiredAgent"
  /tasks:
    get:
      operationId: listTasks
      tags: [office]
      summary: List task runs
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [office]
      summary: Queue a manual agent task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Queued task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /emergency-stop:
    post:
      operationId: setEmergencyStop
      tags: [office]
      summary: Toggle the global emergency stop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyStopInput"
      responses:
        "200":
          description: Updated emergency stop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyStop"
  /approvals:
    get:
      operationId: listApprovals
      tags: [office]
      summary: List pending approvals
      responses:
        "200":
          description: Approvals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"
  /approvals/{approvalId}:
    patch:
      operationId: decideApproval
      tags: [office]
      summary: Approve or reject an approval request
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: Updated approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
  /audit:
    get:
      operationId: searchAudit
      tags: [office]
      summary: Search the audit history
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: kind
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: number }
        - name: offset
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Matching audit events, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
  /audit/verify:
    get:
      operationId: verifyAudit
      tags: [office]
      summary: Verify the tamper-evident audit chain
      responses:
        "200":
          description: Chain verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerification"
  /runtime/health:
    get:
      operationId: getRuntimeHealth
      tags: [office]
      summary: Report execution runtime and queue health
      responses:
        "200":
          description: Runtime health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeHealthReport"
  /teams:
    get:
      operationId: listTeams
      tags: [office]
      summary: List teams with their lead and members
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [office]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "409":
          description: Team name already in use
  /teams/{teamId}:
    patch:
      operationId: updateTeam
      tags: [office]
      summary: Rename a team, change its mission, or assign its lead
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Team not found
        "409":
          description: Team name already in use or lead is not a member
    delete:
      operationId: deleteTeam
      tags: [office]
      summary: Disband a team
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "204":
          description: Team disbanded
        "404":
          description: Team not found
  /teams/{teamId}/members:
    post:
      operationId: addTeamMember
      tags: [office]
      summary: Add an agent to a team
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Team or agent not found
  /teams/{teamId}/members/{agentId}:
    delete:
      operationId: removeTeamMember
      tags: [office]
      summary: Remove an agent from a team
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Team or member not found
  /tasks/{taskId}/delegate:
    post:
      operationId: delegateTask
      tags: [office]
      summary: Delegate a sub-task from this task to an authorized teammate
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegationInput"
      responses:
        "201":
          description: Delegated sub-task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "403":
          description: Delegation not permitted by policy
        "404":
          description: Task or teammate not found
  /tasks/{taskId}/tree:
    get:
      operationId: getTaskTree
      tags: [office]
      summary: Get the whole delegation tree this task belongs to
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTree"
        "404":
          description: Task not found
  /messages:
    get:
      operationId: listAgentMessages
      tags: [office]
      summary: List messages exchanged between agents
      parameters:
        - name: taskId
          in: query
          required: false
          schema: { type: string }
        - name: agentId
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Messages, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentMessage"
  /voice/status:
    get:
      operationId: getVoiceStatus
      tags: [office]
      summary: Report whether voice conversations are available
      responses:
        "200":
          description: Voice service status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceStatus"
  /voice/settings:
    put:
      operationId: updateVoiceSettings
      tags: [office]
      summary: Update voice settings such as transcript storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceSettingsInput"
      responses:
        "200":
          description: Updated voice status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceStatus"
  /voice/transcribe:
    post:
      operationId: transcribeAudio
      tags: [office]
      summary: Transcribe a (possibly in-progress) recording for live captions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeAudioInput"
      responses:
        "200":
          description: Transcribed text so far
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribedText"
        "400":
          description: The audio payload could not be decoded
        "502":
          description: Transcription failed
        "503":
          description: Voice services are unavailable
  /agents/{agentId}/converse:
    post:
      operationId: converseWithAgent
      tags: [office]
      summary: Have a short text conversation with an agent
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConverseInput"
      responses:
        "200":
          description: The agent's reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConverseResponse"
        "404":
          description: Agent not found
        "409":
          description: Agent cannot converse right now
        "503":
          description: No response provider is configured
  /agents/{agentId}/voice-converse:
    post:
      operationId: voiceConverseWithAgent
      tags: [office]
      summary: Speak to an agent; streams transcription, reply, and audio
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceConverseInput"
      responses:
        "200":
          description: >-
            Server-sent event stream with events: user_transcript, reply,
            proposed_task, audio (base64 PCM16 chunks), error, done.
          content:
            text/event-stream:
              schema: { type: string }
        "404":
          description: Agent not found
        "409":
          description: Agent cannot converse right now
        "503":
          description: Voice services are unavailable
  /providers:
    get:
      operationId: getProviders
      tags: [office]
      summary: Get configured provider health
      responses:
        "200":
          description: Provider state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderStatus"
  /providers/settings:
    get:
      operationId: getProviderSettings
      tags: [office]
      summary: Get workspace-level provider routing defaults
      responses:
        "200":
          description: Provider settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSettings"
    put:
      operationId: updateProviderSettings
      tags: [office]
      summary: Update workspace-level provider routing defaults
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderSettingsInput"
      responses:
        "200":
          description: Updated provider settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSettings"
  /providers/codex/test:
    post:
      operationId: testCodexConnection
      tags: [office]
      summary: Check Codex readiness locally without contacting OpenAI
      responses:
        "200":
          description: Connection check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodexConnectionTest"
  /providers/codex/bootstrap:
    post:
      operationId: bootstrapCodex
      tags: [office]
      summary: Seed this account's Codex sign-in from CODEX_AUTH_JSON if it has none
      responses:
        "200":
          description: Bootstrap result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodexBootstrapResult"
  /providers/codex/credential:
    post:
      operationId: connectCodex
      tags: [office]
      summary: Connect this account's own ChatGPT Codex sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodexCredentialInput"
      responses:
        "200":
          description: Connection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodexBootstrapResult"
        "422":
          description: The pasted file is not a usable Codex sign-in
    delete:
      operationId: disconnectCodex
      tags: [office]
      summary: Remove this account's stored Codex sign-in
      responses:
        "200":
          description: Disconnection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodexBootstrapResult"
  /providers/{provider}/models:
    get:
      operationId: listProviderModels
      tags: [office]
      summary: List models available for a provider
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [claude_max, codex_chatgpt, openrouter] }
      responses:
        "200":
          description: Provider model catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderModels"
  /tasks/{taskId}:
    get:
      operationId: getTask
      tags: [office]
      summary: Get one task with its execution logs
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "404":
          description: Task not found
  /tasks/{taskId}/cancel:
    post:
      operationId: cancelTask
      tags: [office]
      summary: Cancel a queued, running, blocked, or waiting task immediately
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Cancelled task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
        "409":
          description: Task is already finished
  /tasks/{taskId}/retry:
    post:
      operationId: retryTask
      tags: [office]
      summary: Requeue a failed, blocked, or cancelled task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Requeued task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
        "409":
          description: Task is not in a retryable state
  /tasks/{taskId}/fallback:
    post:
      operationId: decideTaskFallback
      tags: [office]
      summary: Decide what a task stopped by a provider outage or exhausted allowance should do
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskFallbackInput"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
        "409":
          description: Task is not stopped, or no fallback provider is available
  /tasks/estimate:
    post:
      operationId: estimateTask
      tags: [office]
      summary: Estimate provider, model, tokens, and cost for a task before dispatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskEstimateInput"
      responses:
        "200":
          description: Task estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskEstimate"
        "404":
          description: Agent not found
  /memories:
    get:
      operationId: listMemories
      tags: [office]
      summary: List or search memories, optionally scoped to one agent
      parameters:
        - name: agentId
          in: query
          required: false
          description: Filter to one agent's memories plus shared memories; "shared" for shared-only
          schema: { type: string }
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Memories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryList"
    post:
      operationId: createMemory
      tags: [office]
      summary: Save a memory for an agent or the whole office
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryInput"
      responses:
        "201":
          description: Created memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "404":
          description: Agent not found
        "409":
          description: Memory limit reached
    delete:
      operationId: clearMemories
      tags: [office]
      summary: Clear all memories, optionally for one agent only
      parameters:
        - name: agentId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Number of memories deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearMemoriesResult"
  /memories/export:
    get:
      operationId: exportMemories
      tags: [office]
      summary: Export every memory as a JSON document
      responses:
        "200":
          description: Full memory export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryList"
  /memories/{memoryId}:
    patch:
      operationId: updateMemory
      tags: [office]
      summary: Edit, pin, disable, or reassign a memory
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryUpdate"
      responses:
        "200":
          description: Updated memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "404":
          description: Memory not found
    delete:
      operationId: deleteMemory
      tags: [office]
      summary: Delete a memory permanently
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      responses:
        "204":
          description: Memory deleted
        "404":
          description: Memory not found
  /knowledge:
    get:
      operationId: listKnowledgeFiles
      tags: [office]
      summary: List uploaded knowledge files with their agent assignments
      responses:
        "200":
          description: Knowledge files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeFile"
    post:
      operationId: uploadKnowledgeFile
      tags: [office]
      summary: Upload a text-based knowledge file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeFileInput"
      responses:
        "201":
          description: Stored knowledge file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeFile"
        "400":
          description: Unsupported file type or empty content
        "409":
          description: Storage limit reached
  /knowledge/{fileId}:
    delete:
      operationId: deleteKnowledgeFile
      tags: [office]
      summary: Delete a knowledge file and its assignments
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "204":
          description: File deleted
        "404":
          description: File not found
  /knowledge/{fileId}/assignments:
    put:
      operationId: setKnowledgeAssignments
      tags: [office]
      summary: Set which agents may use a knowledge file
      parameters:
        - $ref: "#/components/parameters/FileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeAssignmentsInput"
      responses:
        "200":
          description: Updated knowledge file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeFile"
        "404":
          description: File or agent not found
  /tasks/{taskId}/usage:
    post:
      operationId: recordTaskUsage
      tags: [office]
      summary: Record actual token usage and cost after execution
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUsageInput"
      responses:
        "200":
          description: Task with recorded usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
  /schedules:
    get:
      operationId: listSchedules
      tags: [office]
      summary: List durable task schedules
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
    post:
      operationId: createSchedule
      tags: [office]
      summary: Create a one-time or recurring task schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "201":
          description: Created schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
  /schedules/{scheduleId}:
    patch:
      operationId: updateSchedule
      tags: [office]
      summary: Update or enable/disable a schedule
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdate"
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
    delete:
      operationId: deleteSchedule
      tags: [office]
      summary: Delete a schedule (already-created tasks are kept)
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /notifications:
    get:
      operationId: listNotifications
      tags: [office]
      summary: List in-app notifications with the unread count
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema: { type: boolean }
        - name: limit
          in: query
          required: false
          schema: { type: number, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
  /notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [office]
      summary: Mark notifications as read (all when no ids are given)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkNotificationsReadInput"
      responses:
        "200":
          description: How many notifications were marked read
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: number }
  /reports/usage:
    get:
      operationId: getUsageReport
      tags: [office]
      summary: Real usage, cost, outcome, and health reporting
      responses:
        "200":
          description: Usage report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageReport"
  /connected-apps:
    get:
      operationId: listConnectedApps
      tags: [office]
      summary: Workspace connected-app inventory with connection status and grant counts
      responses:
        "200":
          description: Connected app inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAppList"
  /connected-apps/{app}:
    patch:
      operationId: updateConnectedApp
      tags: [office]
      summary: Enable or disable a connected app for every agent at once
      parameters:
        - name: app
          in: path
          required: true
          schema: { type: string, enum: [gmail, google_drive, github] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectedAppUpdate"
      responses:
        "200":
          description: Updated connected app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedApp"
        "404":
          description: Unknown app
  /google/oauth/start:
    post:
      operationId: startGoogleOauth
      tags: [office]
      summary: Begin the in-app Google OAuth consent flow for Gmail or Google Drive
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleOauthStartRequest"
      responses:
        "200":
          description: Consent URL for the browser to visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOauthStart"
        "503":
          description: Google OAuth is not configured on this server
  /google/oauth/disconnect:
    post:
      operationId: disconnectGoogleAccount
      tags: [office]
      summary: Disconnect the workspace's Gmail account and revoke its credential
      responses:
        "200":
          description: Disconnect result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOauthDisconnect"
  /github/oauth/start:
    post:
      operationId: startGithubOauth
      tags: [office]
      summary: Begin the in-app GitHub OAuth consent flow
      responses:
        "200":
          description: Consent URL for the browser to visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubOauthStart"
        "503":
          description: GitHub OAuth is not configured on this server
  /github/oauth/disconnect:
    post:
      operationId: disconnectGithubAccount
      tags: [office]
      summary: Disconnect the workspace's GitHub account and revoke its credential
      responses:
        "200":
          description: Disconnect result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubOauthDisconnect"
components:
  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string }
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema: { type: string }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: string }
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema: { type: string }
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Agent:
      type: object
      required: [id, name, title, mission, provider, status, securityPreset, autonomy, permissions, appGrants, sensitiveDataSandbox, avatar, archived, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        title: { type: string }
        mission: { type: string }
        specialization: { type: ["string", "null"] }
        personality: { type: ["string", "null"] }
        goals: { type: ["string", "null"] }
        instructions: { type: ["string", "null"] }
        provider: { type: ["string", "null"], enum: [claude_max, codex_chatgpt, openrouter, null] }
        model: { type: ["string", "null"] }
        codexModel:
          type: ["string", "null"]
          description: Preferred Codex model for this agent; falls back to the workspace default.
        codexReasoning:
          type: ["string", "null"]
          enum: [minimal, low, medium, high, xhigh, max, ultra, null]
        voiceStyle: { type: ["string", "null"] }
        status: { type: string, enum: [idle, working, researching, waiting, paused, error, queued, complete] }
        securityPreset: { type: string, enum: [observer, assistant, operator] }
        autonomy: { type: string, enum: [supervised, limited, autonomous] }
        permissions: { $ref: "#/components/schemas/AgentPermissions" }
        permissionOverrides:
          oneOf:
            - $ref: "#/components/schemas/AgentPermissionOverrides"
            - type: "null"
        appGrants:
          type: array
          items: { $ref: "#/components/schemas/AppGrant" }
        sensitiveDataSandbox:
          type: boolean
          description: >-
            Sensitive data sandbox. When true the server keeps this agent's
            granted read-only app operations but denies connected-app drafts
            and writes, blocks internet/web access for Codex runs, forbids
            delegating or receiving delegated work, and excludes shared
            memories and knowledge from its prompts.
        avatar: { $ref: "#/components/schemas/AvatarConfig" }
        archived: { type: boolean }
        archivedAt: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    AgentPermissions:
      type: object
      description: Effective budgets and limits after overrides are applied. Null means no limit.
      required:
        [
          maxTaskBudgetCents,
          dailyBudgetCents,
          maxTasksPerDay,
          approvalThresholdCents,
          allowedProviders,
          maxRunSeconds,
          maxOutputTokens,
          maxAttempts,
          maxDelegationDepth,
          maxSubtasksPerTask,
        ]
      properties:
        maxTaskBudgetCents: { type: [number, "null"], minimum: 0 }
        dailyBudgetCents: { type: [number, "null"], minimum: 0 }
        maxTasksPerDay: { type: [number, "null"], minimum: 0 }
        approvalThresholdCents: { type: [number, "null"], minimum: 0 }
        allowedProviders:
          oneOf:
            - type: array
              items: { type: string, enum: [claude_max, codex_chatgpt, openrouter] }
            - type: "null"
        maxRunSeconds: { type: [number, "null"], minimum: 0 }
        maxOutputTokens: { type: [number, "null"], minimum: 0 }
        maxAttempts: { type: [number, "null"], minimum: 0 }
        maxDelegationDepth: { type: [number, "null"], minimum: 0 }
        maxSubtasksPerTask: { type: [number, "null"], minimum: 0 }
    AgentPermissionOverrides:
      type: object
      description: Custom limits overriding the security preset profile. Omitted fields fall back to the profile.
      properties:
        maxTaskBudgetCents: { type: [number, "null"], minimum: 0 }
        dailyBudgetCents: { type: [number, "null"], minimum: 0 }
        maxTasksPerDay: { type: [number, "null"], minimum: 0 }
        approvalThresholdCents: { type: [number, "null"], minimum: 0 }
        allowedProviders:
          oneOf:
            - type: array
              items: { type: string, enum: [claude_max, codex_chatgpt, openrouter] }
            - type: "null"
        maxRunSeconds: { type: [number, "null"], minimum: 0 }
        maxOutputTokens: { type: [number, "null"], minimum: 0 }
        maxAttempts: { type: [number, "null"], minimum: 0 }
        maxDelegationDepth: { type: [number, "null"], minimum: 0 }
        maxSubtasksPerTask: { type: [number, "null"], minimum: 0 }
    AgentDetail:
      type: object
      required: [agent, tasks, recentActions]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        recentActions:
          type: array
          items:
            $ref: "#/components/schemas/AppAction"
    RetiredAgent:
      type: object
      required: [id, name, title, mission, provider, securityPreset, avatar, createdAt, retiredAt]
      properties:
        id: { type: string }
        name: { type: string }
        title: { type: string }
        mission: { type: string }
        provider: { type: ["string", "null"], enum: [claude_max, codex_chatgpt, openrouter, null] }
        model: { type: ["string", "null"] }
        securityPreset: { type: string, enum: [observer, assistant, operator] }
        avatar: { $ref: "#/components/schemas/AvatarConfig" }
        createdAt: { type: string, format: date-time }
        retiredAt: { type: string, format: date-time }
    AvatarConfig:
      type: object
      required: [shellColor, deskStyle, accessory]
      properties:
        shellColor: { type: string }
        deskStyle: { type: string }
        accessory: { type: string }
        expression: { type: string }
    AgentInput:
      type: object
      required: [name, title, mission, securityPreset]
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        title: { type: string, minLength: 2, maxLength: 80 }
        mission: { type: string, minLength: 5, maxLength: 2000 }
        specialization: { type: string, maxLength: 200 }
        personality: { type: string, maxLength: 2000 }
        goals: { type: string, maxLength: 4000 }
        instructions: { type: string, maxLength: 4000 }
        provider: { type: ["string", "null"], enum: [claude_max, codex_chatgpt, openrouter, null] }
        model: { type: string, maxLength: 180 }
        codexModel: { type: ["string", "null"], maxLength: 200 }
        codexReasoning:
          type: ["string", "null"]
          enum: [minimal, low, medium, high, xhigh, max, ultra, null]
        voiceStyle: { type: string, maxLength: 60 }
        securityPreset: { type: string, enum: [observer, assistant, operator] }
        autonomy: { type: string, enum: [supervised, limited, autonomous] }
        permissionOverrides:
          oneOf:
            - $ref: "#/components/schemas/AgentPermissionOverrides"
            - type: "null"
        appGrants:
          type: array
          items: { $ref: "#/components/schemas/AppGrant" }
        sensitiveDataSandbox: { type: boolean }
        avatar: { $ref: "#/components/schemas/AvatarConfig" }
    AgentUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        title: { type: string, minLength: 2, maxLength: 80 }
        mission: { type: string, minLength: 5, maxLength: 2000 }
        specialization: { type: ["string", "null"], maxLength: 200 }
        personality: { type: ["string", "null"], maxLength: 2000 }
        goals: { type: ["string", "null"], maxLength: 4000 }
        instructions: { type: ["string", "null"], maxLength: 4000 }
        provider: { type: ["string", "null"], enum: [claude_max, codex_chatgpt, openrouter, null] }
        model: { type: ["string", "null"], maxLength: 180 }
        codexModel: { type: ["string", "null"], maxLength: 200 }
        codexReasoning:
          type: ["string", "null"]
          enum: [minimal, low, medium, high, xhigh, max, ultra, null]
        voiceStyle: { type: ["string", "null"], maxLength: 60 }
        securityPreset: { type: string, enum: [observer, assistant, operator] }
        autonomy: { type: string, enum: [supervised, limited, autonomous] }
        permissionOverrides:
          oneOf:
            - $ref: "#/components/schemas/AgentPermissionOverrides"
            - type: "null"
        appGrants:
          type: array
          items: { $ref: "#/components/schemas/AppGrant" }
        sensitiveDataSandbox: { type: boolean }
        avatar: { $ref: "#/components/schemas/AvatarConfig" }
    AppGrant:
      type: object
      description: >-
        Explicit permission for one agent to use one connected app. "read"
        only looks, "draft" may prepare content nobody outside the workspace
        account sees (email drafts, new Drive files), "write" may take
        externally visible actions — those always pass through the approval
        desk before running.
      required: [app, accessLevel]
      properties:
        app: { type: string, enum: [gmail, google_drive, github] }
        accessLevel: { type: string, enum: [read, draft, write] }
    GoogleOauthStartRequest:
      type: object
      description: >
        Which Google-backed app to request consent for. Omitting the body
        (or the service) starts a Gmail flow; google_drive runs an
        incremental consent that adds Drive scopes to the same account.
      properties:
        service: { type: string, enum: [gmail, google_drive] }
    GoogleOauthStart:
      type: object
      required: [authUrl]
      properties:
        authUrl:
          type: string
          description: Google consent URL the browser should navigate to.
    GoogleOauthDisconnect:
      type: object
      required: [disconnected]
      properties:
        disconnected: { type: boolean }
    GithubOauthStart:
      type: object
      required: [authUrl]
      properties:
        authUrl:
          type: string
          description: GitHub consent URL the browser should navigate to.
    GithubOauthDisconnect:
      type: object
      required: [disconnected]
      properties:
        disconnected: { type: boolean }
    ConnectedApp:
      type: object
      required: [app, displayName, enabled, status, statusDetail, accountLabel, grantedAgents]
      properties:
        app: { type: string, enum: [gmail, google_drive, github] }
        displayName: { type: string }
        enabled: { type: boolean }
        status:
          type: string
          enum: [connected, expired, not_connected, unavailable]
          description: >-
            Live connection state of the workspace owner's account:
            "expired" means the account was connected but its authorization
            must be renewed; "unavailable" means the connector service itself
            could not be reached, not that the account is disconnected.
        statusDetail: { type: ["string", "null"] }
        accountLabel:
          type: ["string", "null"]
          description: >-
            Human-readable identity of the connected account (email or
            login) when the platform exposes one. Never a credential.
        grantedAgents: { type: number }
    ConnectedAppList:
      type: object
      required: [apps]
      properties:
        apps:
          type: array
          items: { $ref: "#/components/schemas/ConnectedApp" }
    ConnectedAppUpdate:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    ArchiveInput:
      type: object
      required: [archived]
      properties:
        archived: { type: boolean }
    PauseInput:
      type: object
      required: [paused]
      properties:
        paused: { type: boolean }
    Task:
      type: object
      required: [id, agentId, agentName, objective, status, priority, attempts, files, createdAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        agentName: { type: string }
        objective: { type: string }
        status: { type: string, enum: [queued, running, waiting_approval, blocked, completed, failed, cancelled] }
        priority: { type: string, enum: [low, normal, high] }
        budgetCents: { type: [number, "null"] }
        provider: { type: string, enum: [claude_max, codex_chatgpt, openrouter] }
        model: { type: [string, "null"] }
        reasoningEffort:
          type: ["string", "null"]
          enum: [minimal, low, medium, high, xhigh, max, ultra, null]
        providerPhase:
          type: ["string", "null"]
          enum:
            [
              queued,
              starting,
              running,
              waiting_approval,
              completed,
              rate_limited,
              auth_required,
              failed,
              cancelled,
              null,
            ]
          description: Coarse execution phase shown while a task runs; `status` stays authoritative.
        providerThreadId: { type: [string, "null"] }
        conversationId: { type: [string, "null"] }
        estimatedTokens: { type: [number, "null"] }
        estimatedCostCents: { type: [number, "null"] }
        actualInputTokens: { type: [number, "null"] }
        actualOutputTokens: { type: [number, "null"] }
        actualCostCents:
          type: [number, "null"]
          description: >-
            Null when the provider publishes no per-token price — for
            subscription allowances this is "not applicable", never a $0.00
            charge.
        cachedInputTokens: { type: [number, "null"] }
        cacheWriteInputTokens: { type: [number, "null"] }
        reasoningOutputTokens: { type: [number, "null"] }
        queuedMs: { type: [number, "null"] }
        runMs: { type: [number, "null"] }
        fallbackFromProvider:
          type: ["string", "null"]
          enum: [claude_max, codex_chatgpt, openrouter, null]
        fallbackReason: { type: [string, "null"] }
        paidFallbackApprovedAt: { type: [string, "null"], format: date-time }
        output: { type: [string, "null"] }
        files:
          type: array
          items:
            $ref: "#/components/schemas/TaskFile"
        errorKind: { type: [string, "null"] }
        errorMessage: { type: [string, "null"] }
        attempts: { type: number }
        parentTaskId: { type: [string, "null"] }
        rootTaskId: { type: [string, "null"] }
        depth: { type: number }
        teamId: { type: [string, "null"] }
        teamName: { type: [string, "null"] }
        delegatedByAgentId: { type: [string, "null"] }
        delegatedByAgentName: { type: [string, "null"] }
        runtime: { type: string }
        contextSources:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/TaskSource"
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    Team:
      type: object
      required: [id, name, members, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        mission: { type: [string, "null"] }
        leadAgentId: { type: [string, "null"] }
        leadAgentName: { type: [string, "null"] }
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
        createdAt: { type: string, format: date-time }
    TeamMember:
      type: object
      required: [agentId, name, title, isLead, avatar]
      properties:
        agentId: { type: string }
        name: { type: string }
        title: { type: string }
        isLead: { type: boolean }
        avatar: { $ref: "#/components/schemas/AvatarConfig" }
    TeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        mission: { type: string, maxLength: 2000 }
        leadAgentId: { type: string }
        memberAgentIds:
          type: array
          items: { type: string }
    TeamUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        mission: { type: [string, "null"], maxLength: 2000 }
        leadAgentId: { type: [string, "null"] }
    TeamMemberInput:
      type: object
      required: [agentId]
      properties:
        agentId: { type: string }
    DelegationInput:
      type: object
      required: [agentId, objective]
      properties:
        agentId: { type: string }
        objective: { type: string, minLength: 3, maxLength: 5000 }
        priority: { type: string, enum: [low, normal, high] }
        budgetCents: { type: number, minimum: 0.01, maximum: 1000000 }
        note: { type: string, maxLength: 2000 }
    TaskTreeNode:
      type: object
      required: [id, agentId, agentName, objective, status, depth, createdAt]
      properties:
        id: { type: string }
        parentTaskId: { type: [string, "null"] }
        agentId: { type: string }
        agentName: { type: string }
        objective: { type: string }
        status: { type: string, enum: [queued, running, waiting_approval, blocked, completed, failed, cancelled] }
        depth: { type: number }
        delegatedByAgentName: { type: [string, "null"] }
        actualCostCents: { type: [number, "null"] }
        createdAt: { type: string, format: date-time }
    TaskTree:
      type: object
      required: [rootTaskId, nodes]
      properties:
        rootTaskId: { type: string }
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TaskTreeNode"
    AgentMessage:
      type: object
      required: [id, kind, body, createdAt]
      properties:
        id: { type: string }
        fromAgentId: { type: [string, "null"] }
        fromAgentName: { type: [string, "null"] }
        toAgentId: { type: [string, "null"] }
        toAgentName: { type: [string, "null"] }
        taskId: { type: [string, "null"] }
        kind: { type: string, enum: [delegation, result, note, voice] }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    VoiceStatus:
      type: object
      required: [available, reason, transcriptsEnabled]
      properties:
        available: { type: boolean }
        reason: { type: [string, "null"] }
        transcriptsEnabled: { type: boolean }
    VoiceSettingsInput:
      type: object
      required: [transcriptsEnabled]
      properties:
        transcriptsEnabled: { type: boolean }
    ConverseTurn:
      type: object
      required: [role, text]
      properties:
        role: { type: string, enum: [user, agent] }
        text: { type: string, maxLength: 8000 }
    ConverseInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000 }
        history:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ConverseTurn"
    ConverseResponse:
      type: object
      required: [reply, proposedTaskObjective, voice]
      properties:
        reply: { type: string }
        proposedTaskObjective: { type: [string, "null"] }
        voice:
          type: [string, "null"]
          description: OpenAI voice id the agent speaks with; null = text only
    VoiceConverseInput:
      type: object
      required: [audio]
      properties:
        audio:
          type: string
          description: Base64-encoded audio recording (webm/mp4/wav/ogg)
        history:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ConverseTurn"
    TranscribeAudioInput:
      type: object
      required: [audio]
      properties:
        audio:
          type: string
          description: Base64-encoded audio captured so far (webm/mp4/wav/ogg)
    TranscribedText:
      type: object
      required: [text]
      properties:
        text: { type: string }
    RuntimeInfo:
      type: object
      required: [id, label, status, detail, acceptsWork]
      properties:
        id: { type: string }
        label: { type: string }
        status: { type: string, enum: [ready, degraded, not_installed] }
        detail: { type: string }
        acceptsWork: { type: boolean }
    RuntimeHealthReport:
      type: object
      required: [activeRuntime, runtimes, queue, worker]
      properties:
        activeRuntime: { type: string }
        runtimes:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeInfo"
        queue:
          type: object
          required: [queued, running, waitingApproval, blocked, oldestQueuedSeconds]
          properties:
            queued: { type: number }
            running: { type: number }
            waitingApproval: { type: number }
            blocked: { type: number }
            oldestQueuedSeconds: { type: [number, "null"] }
        worker:
          type: object
          required: [leaseHeld, running, inFlight, emergencyStop]
          properties:
            leaseHeld: { type: boolean }
            running: { type: boolean }
            inFlight: { type: number }
            emergencyStop: { type: boolean }
            lastTickAt: { type: [string, "null"], format: date-time }
    TaskSource:
      type: object
      required: [type, id, label, title]
      properties:
        type: { type: string, enum: [memory, file] }
        id: { type: string }
        label: { type: string }
        title: { type: string }
    TaskFile:
      type: object
      required: [name, content]
      properties:
        name: { type: string }
        content: { type: string }
    TaskLog:
      type: object
      required: [id, level, message, createdAt]
      properties:
        id: { type: string }
        level: { type: string, enum: [info, warn, error] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
    AppAction:
      type: object
      required: [id, taskId, agentId, app, operation, targetSummary, status, createdAt]
      properties:
        id: { type: string }
        taskId: { type: string }
        agentId: { type: string }
        app: { type: string }
        operation: { type: string }
        targetSummary: { type: string }
        status:
          type: string
          enum:
            [
              waiting_approval,
              approved,
              executing,
              executed,
              failed,
              denied,
              rejected,
              expired,
            ]
        approvalId: { type: [string, "null"] }
        resultSummary: { type: [string, "null"] }
        errorMessage: { type: [string, "null"] }
        taskObjective: { type: [string, "null"] }
        decidedAt: { type: [string, "null"], format: date-time }
        executedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    TaskDetail:
      type: object
      required: [task, logs, actions]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        logs:
          type: array
          items:
            $ref: "#/components/schemas/TaskLog"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/AppAction"
    TaskInput:
      type: object
      required: [agentId, objective]
      properties:
        agentId: { type: string }
        objective: { type: string, minLength: 3, maxLength: 5000 }
        priority: { type: string, enum: [low, normal, high] }
        budgetCents: { type: number, minimum: 0.01, maximum: 1000000 }
        providerOverride: { type: string, enum: [claude_max, codex_chatgpt, openrouter] }
        modelOverride: { type: string, maxLength: 200 }
        reasoningOverride:
          type: string
          enum: [minimal, low, medium, high, xhigh, max, ultra]
        continueConversation:
          type: boolean
          description: Continue the agent's most recent provider thread instead of starting a new one.
    TaskEstimateInput:
      type: object
      required: [agentId, objective]
      properties:
        agentId: { type: string }
        objective: { type: string, minLength: 3, maxLength: 5000 }
        providerOverride: { type: string, enum: [claude_max, codex_chatgpt, openrouter] }
        modelOverride: { type: string, maxLength: 200 }
    TaskEstimate:
      type: object
      required:
        [
          provider,
          model,
          billing,
          estimatedInputTokens,
          estimatedOutputTokens,
          estimatedTokens,
          estimatedCostCents,
          costKnown,
        ]
      properties:
        provider: { type: string, enum: [claude_max, codex_chatgpt, openrouter] }
        model: { type: string }
        billing: { type: string, enum: [subscription, metered] }
        estimatedInputTokens: { type: number }
        estimatedOutputTokens: { type: number }
        estimatedTokens: { type: number }
        estimatedCostCents: { type: number }
        costKnown:
          type: boolean
          description: False when no price can be computed; the UI must not present the amount as a real figure.
        note: { type: [string, "null"] }
    TaskFallbackInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [wait, cancel, approve_paid_fallback]
          description: >-
            "wait" requeues the task on its current provider, "cancel" stops
            it, and "approve_paid_fallback" is the owner's explicit,
            per-task authorization to continue on a metered provider.
    TaskUsageInput:
      type: object
      required: [inputTokens, outputTokens]
      properties:
        inputTokens: { type: number, minimum: 0 }
        outputTokens: { type: number, minimum: 0 }
        costCents: { type: number, minimum: 0 }
    Approval:
      type: object
      required: [id, agentName, action, status, createdAt, expiresAt]
      properties:
        id: { type: string }
        agentName: { type: string }
        taskId: { type: [string, "null"] }
        taskObjective: { type: [string, "null"] }
        action: { type: string }
        details: { type: string }
        status: { type: string, enum: [pending, approved, rejected, expired, cancelled] }
        decidedAt: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }
    ProviderStatus:
      type: object
      required:
        [
          provider,
          label,
          billing,
          enabled,
          configured,
          healthy,
          authMode,
          usesSubscriptionAllowance,
          allowanceBalanceKnown,
          reasoningLevels,
        ]
      properties:
        provider: { type: string, enum: [claude_max, codex_chatgpt, openrouter] }
        label: { type: string }
        billing: { type: string, enum: [subscription, metered] }
        enabled:
          type: boolean
          description: False when a server-side feature flag hides this provider.
        configured: { type: boolean }
        healthy: { type: boolean }
        message: { type: string }
        authMode:
          type: ["string", "null"]
          enum: [chatgpt, api_key, unknown, null]
          description: >-
            Codex only. Only "chatgpt" draws on the ChatGPT Codex allowance;
            "api_key" means the stored credential bills OpenAI's API instead.
        usesSubscriptionAllowance:
          type: boolean
          description: Confirmed from stored credentials, never assumed from the provider id.
        allowanceBalanceKnown:
          type: boolean
          description: Whether the remaining plan allowance can be reported at all.
        reasoningLevels:
          type: array
          description: Reasoning effort levels this provider accepts, from server configuration. Empty when it has no such control.
          items: { type: string }
    CodexConnectionCheck:
      type: object
      required: [name, ok, detail]
      properties:
        name: { type: string }
        ok: { type: boolean }
        detail: { type: string }
    CodexConnectionTest:
      type: object
      description: >-
        Result of a local-only Codex readiness check. No request is made to
        OpenAI, so running it never consumes the ChatGPT allowance.
      required: [ok, checks]
      properties:
        ok: { type: boolean }
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CodexConnectionCheck"
    CodexBootstrapResult:
      type: object
      required: [action, detail]
      properties:
        action:
          type: string
          enum: [connected, preserved, skipped, disconnected, unavailable]
        detail: { type: string }
    CodexCredentialInput:
      type: object
      description: >-
        The contents of the auth.json written by `codex login` on a desktop.
        It is encrypted before storage, never returned by any endpoint, and
        never exposed to an agent's tools or prompts.
      required: [authJson]
      properties:
        authJson: { type: string, minLength: 2, maxLength: 20000 }
    ProviderSettings:
      type: object
      required:
        [
          defaultProvider,
          claudeModel,
          openrouterModel,
          codexModel,
          codexReasoning,
          fallbackOrder,
          paidFallbackConsent,
          paidFallbackLimitCents,
        ]
      properties:
        defaultProvider: { type: string, enum: [claude_max, codex_chatgpt, openrouter] }
        claudeModel: { type: [string, "null"] }
        openrouterModel: { type: [string, "null"] }
        codexModel: { type: [string, "null"] }
        codexReasoning:
          type: ["string", "null"]
          enum: [minimal, low, medium, high, xhigh, max, ultra, null]
        fallbackOrder:
          type: array
          description: Providers to try, in order, when the primary one stops. Empty means never fall back.
          items: { type: string, enum: [claude_max, codex_chatgpt, openrouter] }
        paidFallbackConsent:
          type: boolean
          description: Standing authorization to fall back onto a metered provider without per-task approval.
        paidFallbackLimitCents: { type: [number, "null"] }
    ProviderSettingsInput:
      type: object
      properties:
        defaultProvider: { type: string, enum: [claude_max, codex_chatgpt, openrouter] }
        claudeModel: { type: [string, "null"], maxLength: 200 }
        openrouterModel: { type: [string, "null"], maxLength: 200 }
        codexModel: { type: [string, "null"], maxLength: 200 }
        codexReasoning:
          type: ["string", "null"]
          enum: [minimal, low, medium, high, xhigh, max, ultra, null]
        fallbackOrder:
          type: array
          items: { type: string, enum: [claude_max, codex_chatgpt, openrouter] }
        paidFallbackConsent: { type: boolean }
        paidFallbackLimitCents: { type: [number, "null"], minimum: 0 }
    ProviderModel:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        contextLength: { type: [number, "null"] }
        promptCentsPerMTok: { type: [number, "null"] }
        completionCentsPerMTok: { type: [number, "null"] }
    ProviderModels:
      type: object
      required: [provider, available, models]
      properties:
        provider: { type: string, enum: [claude_max, codex_chatgpt, openrouter] }
        available: { type: boolean }
        message: { type: [string, "null"] }
        models:
          type: array
          items:
            $ref: "#/components/schemas/ProviderModel"
    EmergencyStop:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    EmergencyStopInput:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    OfficeOverview:
      type: object
      required: [agents, activeTasks, pendingApprovals, emergencyStop, monthlyCostCents, recentEvents]
      properties:
        agents: { type: number }
        activeTasks: { type: number }
        pendingApprovals: { type: number }
        emergencyStop: { type: boolean }
        monthlyCostCents: { type: number }
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
    AuditEvent:
      type: object
      required: [id, kind, summary, createdAt]
      properties:
        id: { type: string }
        kind: { type: string }
        summary: { type: string }
        chained: { type: boolean }
        createdAt: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [events, total]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        total: { type: number }
    AuditVerification:
      type: object
      required: [valid, checked, firstInvalidId]
      properties:
        valid: { type: boolean }
        checked: { type: number }
        firstInvalidId: { type: [string, "null"] }
    Memory:
      type: object
      required: [id, agentId, agentName, kind, content, pinned, disabled, sourceTaskId, createdAt, updatedAt]
      properties:
        id: { type: string }
        agentId: { type: [string, "null"] }
        agentName: { type: [string, "null"] }
        kind: { type: string, enum: [fact, decision, context, task_outcome, relationship] }
        content: { type: string }
        pinned: { type: boolean }
        disabled: { type: boolean }
        sourceTaskId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MemoryInput:
      type: object
      required: [content]
      properties:
        agentId: { type: [string, "null"] }
        kind: { type: string, enum: [fact, decision, context, task_outcome, relationship] }
        content: { type: string, minLength: 3, maxLength: 4000 }
        pinned: { type: boolean }
    MemoryUpdate:
      type: object
      properties:
        agentId: { type: [string, "null"] }
        kind: { type: string, enum: [fact, decision, context, task_outcome, relationship] }
        content: { type: string, minLength: 3, maxLength: 4000 }
        pinned: { type: boolean }
        disabled: { type: boolean }
    MemoryList:
      type: object
      required: [memories, total]
      properties:
        memories:
          type: array
          items:
            $ref: "#/components/schemas/Memory"
        total: { type: number }
    ClearMemoriesResult:
      type: object
      required: [deleted]
      properties:
        deleted: { type: number }
    KnowledgeFile:
      type: object
      required: [id, name, mimeType, description, sizeBytes, wordCount, agentIds, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        mimeType: { type: string }
        description: { type: [string, "null"] }
        sizeBytes: { type: number }
        wordCount: { type: number }
        agentIds:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    KnowledgeFileInput:
      type: object
      required: [name, mimeType, content]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        mimeType: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        content: { type: string, minLength: 1, maxLength: 200000 }
    KnowledgeAssignmentsInput:
      type: object
      required: [agentIds]
      properties:
        agentIds:
          type: array
          items: { type: string }
    NotifyPrefs:
      type: object
      required: [onCompleted, onFailed, onBlocked, onApprovalNeeded]
      properties:
        onCompleted: { type: boolean }
        onFailed: { type: boolean }
        onBlocked: { type: boolean }
        onApprovalNeeded: { type: boolean }
    ScheduleInput:
      type: object
      required: [name, agentId, objective, cadence, timezone]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        agentId: { type: string }
        objective: { type: string, minLength: 3, maxLength: 5000 }
        priority: { type: string, enum: [low, normal, high] }
        providerOverride: { type: string, enum: [claude_max, codex_chatgpt, openrouter] }
        modelOverride: { type: string, maxLength: 200 }
        budgetCents: { type: number, minimum: 0.01, maximum: 1000000 }
        cadence: { type: string, enum: [once, daily, weekly, monthly] }
        timezone: { type: string, minLength: 1, maxLength: 60 }
        runAt: { type: string, format: date-time }
        timeOfDay: { type: string, pattern: "^([01]?\\d|2[0-3]):[0-5]\\d$" }
        daysOfWeek:
          type: array
          items: { type: number, minimum: 0, maximum: 6 }
        dayOfMonth: { type: number, minimum: 1, maximum: 31 }
